name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mcpbundles/mcp-connect-auth
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Test and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# npm publish setup:
# 1. Create an npm access token with publish scope for @mcpbundles.
# 2. Add NPM_TOKEN to the GitHub "npm" environment (Settings → Environments → npm).
# 3. Tag v0.1.0 (or later) to trigger this workflow.
