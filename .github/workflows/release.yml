name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mcpbundles/mcp-connect-auth
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Use latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Test and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

# npm trusted publishing (one-time — do BEFORE tagging a real release):
#
# Unlike PyPI "pending publisher", npm requires the package name to exist on the
# registry before you can attach a trusted publisher. Bootstrap once from your Mac:
#
#   cd public_github_repos/mcp-connect-auth-js
#   npx setup-trusted-publishing@latest --access public
#   (complete npm 2FA in the browser when prompted)
#
# Then add the trusted publisher on npm (exact fields):
#   https://www.npmjs.com/package/@mcpbundles/mcp-connect-auth/settings
#   → Trusted publishing → GitHub Actions
#     Organization or user: thinkchainai
#     Repository: mcp-connect-auth-js
#     Workflow filename: release.yml
#     Environment name: npm
#     Allowed actions: npm publish
#
# Do NOT add NPM_TOKEN to this repo — long-lived write tokens interfere with OIDC
# and npm will warn you to use Trusted Publishing instead. This workflow only
# needs permissions.id-token: write (already set above).
