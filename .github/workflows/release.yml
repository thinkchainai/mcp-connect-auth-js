name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Test and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

# Package: mcpbundles-mcp-connect-auth (unscoped; same npm account as `mcpbundles` CLI).
# setup-node maps secrets.NPM_TOKEN → NODE_AUTH_TOKEN when registry-url is set.
