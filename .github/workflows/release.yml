name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mcpbundles/mcp-connect-auth
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Test and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# npm publish setup (one-time — do BEFORE tagging v0.1.0):
# 1. Create @mcpbundles org on npmjs.com (if not exists) and grant publish access.
# 2. Create npm automation token with publish scope for @mcpbundles.
# 3. Add NPM_TOKEN to GitHub environment "npm" (Settings → Environments → npm → Secrets).
# 4. Only then tag v0.1.0 — publish fails with ENEEDAUTH until step 3 is done.
